<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard - Profile (Solution)</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="header-logo">
                <img src="public/images/bes-black.png" alt="Logo" width="120" height="90">
            </a>
            <div class="header-middle"></div>
            <div class="header-user-section">
                <button id="user-menu-button" class="header-user-button" aria-label="User account menu">
                    👤
                </button>
                <div id="user-dropdown" class="header-dropdown" style="display: none;">
                    <a href="index.html" class="header-dropdown-item header-dropdown-divider">Leaderboard</a>
                </div>
            </div>
        </div>
    </header>

    <main class="profile-page">
        <div class="profile-container">
            <div class="profile-header">
                <h1 class="profile-title">studentuser Profile</h1>
            </div>

            <div class="profile-info-grid">
                <div class="profile-info-item">
                    <div class="profile-info-label">Username</div>
                    <div class="profile-info-value">studentuser</div>
                </div>
                <div class="profile-info-item">
                    <div class="profile-info-label">Year</div>
                    <div class="profile-info-value">Junior</div>
                </div>
                <div class="profile-info-item">
                    <div class="profile-info-label">Major</div>
                    <div class="profile-info-value">Computer Science</div>
                </div>
                <div class="profile-info-item">
                    <div class="profile-info-label">Main Club</div>
                    <div class="profile-info-value">Black Engineers Society</div>
                </div>
                <div class="profile-info-item">
                    <div class="profile-info-label">Events Attended</div>
                    <div class="profile-info-value">27</div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/profile.js"></script>
</body>
</html>
