<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard - Leaderboard (Solution)</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="profile.html" class="header-logo">
                <img src="public/images/bes-black.png" alt="Logo" width="120" height="90">
            </a>
            <div class="header-middle"></div>
            <div class="header-user-section">
                <button id="user-menu-button" class="header-user-button" aria-label="User account menu">
                    👤
                </button>
                <div id="user-dropdown" class="header-dropdown" style="display: none;">
                    <a href="profile.html" class="header-dropdown-item header-dropdown-divider">View Profile</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="leaderboard-wrapper">
            <div class="leaderboard-container">
                <h1>Attendance Leaderboard</h1>
                
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Year</th>
                            <th>Major</th>
                            <th>Main Club</th>
                            <th>Events Attended</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Data inserted by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/formatters.js"></script>
    <script src="js/leaderboard.js"></script>
</body>
</html>
